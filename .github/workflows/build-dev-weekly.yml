name: Build STT Dev (weekly)
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-dev:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/common.yml
    with:
      runs-on: ${{ matrix.os }}
      gradle-tasks: dist
      checkout-ref: dev

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: build-dev
    if: ${{ needs.build-dev.result == 'failure' }}
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: "❌ Weekly dev build failed: ${{ github.repository }}"
          to: ${{ secrets.BUILD_FAILURE_EMAIL_TO }}
          from: ${{ secrets.BUILD_FAILURE_EMAIL_FROM }}
          body: |
            The weekly dev build failed.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
