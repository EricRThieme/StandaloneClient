[versions]
kotlin = "2.3.0"
dagger = "2.58"
antlr = "4.13.2"
spek = "2.0.4"
javafx = "21.0.4"
controlsfx = "11.2.3"
richtextfx = "0.11.7"
snakeyaml = "2.5"
mbassador = "1.3.2"
jsoniter = "0.9.23"
jakarta-inject = "2.0.1"
commons-io = "2.21.0"
mockito = "5.21.0"
mockito-kotlin = "6.2.1"
assertj = "3.27.6"
junit-dep = "4.11"

sonarqube = "7.2.2.6593"
versions-plugin = "0.53.0"
javafx-plugin = "0.1.0"
moduleplugin = "2.0.0"
jlink = "3.1.5"
git-version = "4.2.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versions-plugin" }
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin" }
moduleplugin = { id = "org.javamodularity.moduleplugin", version.ref = "moduleplugin" }
jlink = { id = "org.beryx.jlink", version.ref = "jlink" }
git-version = { id = "com.palantir.git-version", version.ref = "git-version" }

[libraries]
antlr-tool = { module = "org.antlr:antlr4", version.ref = "antlr" }
antlr-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }

richtextfx = { module = "org.fxmisc.richtext:richtextfx", version.ref = "richtextfx" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
jakarta-inject = { module = "jakarta.inject:jakarta.inject-api", version.ref = "jakarta-inject" }
mbassador = { module = "net.engio:mbassador", version.ref = "mbassador" }
controlsfx = { module = "org.controlsfx:controlsfx", version.ref = "controlsfx" }
jsoniter = { module = "com.jsoniter:jsoniter", version.ref = "jsoniter" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-scripting = { module = "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable", version.ref = "kotlin" }
kotlin-annotation-processing = { module = "org.jetbrains.kotlin:kotlin-annotation-processing-gradle", version.ref = "kotlin" }

commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-dep = { module = "junit:junit-dep", version.ref = "junit-dep" }